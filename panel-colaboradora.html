<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Panel de apoyo · Siembra hábitos</title>
<style>
:root{--g:#5b2a86;--gl:#f3ebfa;--b:#ddcfec;--m:#6b5d7a;--o:#f5c518}*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#faf7fd;color:#241a30;line-height:1.45}
header{background:#3d1a5e;color:#fff;padding:14px 16px;text-align:center}header h1{margin:0;font-size:20px}header p{margin:3px 0 0;font-size:13px;opacity:.85}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px;color:var(--g)}h3{margin:14px 0 8px;font-size:15px;color:#3d1a5e}
input,select{padding:9px 10px;border:1px solid #c5b3d8;border-radius:8px;font-size:14px;font-family:inherit}
input[type=password],input[type=search]{width:100%;max-width:340px}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:bold;cursor:pointer;margin:4px 6px 4px 0}
button.s{background:#fff;color:var(--g);border:1px solid var(--g)}
.err{background:#fde8e8;color:#9b1c1c;padding:10px;border-radius:8px;margin-top:10px;font-size:14px}
.ok{color:var(--g);font-weight:bold;font-size:13px;margin-right:10px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.k{background:var(--gl);border-radius:10px;padding:12px;text-align:center}.k b{display:block;font-size:26px;color:var(--g)}.k span{font-size:12px;color:var(--m)}
.tw{overflow-x:auto;border:1px solid var(--b);border-radius:8px;max-height:520px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--b);padding:6px 8px;text-align:center;white-space:nowrap}th{background:var(--g);color:#fff;position:sticky;top:0}td.l{text-align:left;font-weight:bold}
tr.avg td{background:var(--gl);font-weight:bold}
.step{font-size:13px;color:var(--m);margin:2px 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
.tabs button{margin:0;background:#fff;color:var(--g);border:1px solid var(--b);white-space:nowrap}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.sub button{margin:0;background:#fff;color:#3d1a5e;border:1px solid var(--b);padding:7px 12px}.sub button.on{background:var(--o);color:#3a2a00;border-color:var(--o)}
.bar{display:grid;grid-template-columns:150px 1fr 110px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.trk{background:#f1ecf6;border-radius:99px;height:14px;overflow:hidden}.trk i{display:block;height:100%;background:linear-gradient(90deg,#5b2a86,#a77bd1);border-radius:99px}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.go button{margin:0;text-align:left;background:var(--gl);color:#3d1a5e;border:1px solid var(--b);font-weight:normal;padding:12px}.go button b{display:block;color:var(--g);margin-bottom:2px}
.bt{margin-top:12px;padding:10px;background:#faf7fd;border:1px dashed var(--b);border-radius:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--gl);color:var(--g)}.pill.w{background:#fff4c7;color:#7a5b00}.pill.n{background:#eee;color:#666}
.res{background:var(--gl);border-radius:8px;padding:10px;margin:10px 0}
@media(max-width:600px){.bar{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Panel de apoyo</h1><p>Campaña “Siembra hábitos, cosecha salud” · acceso de colaboradora</p></header>
<div id="nav"></div>
<main id="app"></main>
<script>
const URL="https://vokpjjidytayjrzjespr.supabase.co",KEY="sb_publishable_q6YCquh7-JYBEUrl1UCQfA_NDJ5ROGS";
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s),app=$("#app"),nav=$("#nav");
async function rpc(fn,a){let r;try{r=await fetch(`${URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify(a)})}catch(e){throw new Error("Sin conexión")}
 const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){d=t}if(!r.ok)throw new Error((d&&d.message)||"Error");return d}
let CLAVE="",F=[],SEM=[],GEN="",TAB="inicio",RW=1,RP=true;
const base=()=>location.href.replace(/panel-[a-z]+\.html.*$/,"");
const hoy=()=>new Date().toLocaleDateString("en-CA",{timeZone:"America/Guayaquil"});
async function semanas(){try{const r=await fetch(`${URL}/rest/v1/semanas?select=numero,titulo,fecha_apertura,fecha_cierre&order=numero`,{headers:{apikey:KEY}});SEM=(await r.json()).filter(x=>x.numero<=3);RW=Math.max(1,SEM.filter(x=>x.fecha_apertura<=hoy()).reduce((a,x)=>Math.max(a,x.numero),1))}catch(e){SEM=[]}}
const prog=(f,s)=>(f.progreso||[]).find(x=>x.s==s)||{};
const hab=(f,s)=>((f.habitos||[]).find(x=>x.s==s)||{}).v;
const dash=v=>v==null||v===""?"–":v;
const fecha=d=>d?new Date(d).toLocaleDateString("es-EC"):"–";
const T=(h,r,vacio)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${r.map(row=>`<tr${row.avg?' class="avg"':""}>${(row.avg?row.c:row).map((c,i)=>`<td${i==0?' class="l"':""}>${c&&c.h!==undefined?c.h:esc(c)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${h.length}">${vacio||"Aún no hay registros."}</td></tr>`}</table></div>`;
const AV=c=>({avg:1,c});
const MSG={1:"ya está abierta la Semana 1: Agua primero. Ingrese, responda la evaluación inicial (unos 5 minutos) y comience con la lección y el reto.",
2:"ya está disponible la Semana 2: Plato arcoíris y cocina. Ingrese para ver el nuevo contenido y registrar su semana.",
3:"ya está disponible la Semana 3: En movimiento y sin pantallas, la última semana. Ingrese, registre su semana y complete la evaluación final y la encuesta para recibir su certificado."};
const pend=(f,n)=>n==1?!(f.pre&&hab(f,1)):n==3?!(hab(f,3)&&f.post&&f.sat):!hab(f,n);
const tel=w=>{let d=(w||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("593"))return d;if(d.startsWith("0"))d=d.slice(1);return"593"+d};
const texto=(n,f)=>`${f&&f.nombre?"Estimado/a "+f.nombre:"Estimado/a participante"}: ${MSG[n]}${f?` Su código: ${f.codigo}.`:""} Enlace: ${base()}`;
const L2=()=>F.filter(f=>!RP||pend(f,RW));
let GAS="",ESTADO={},RES="",FORZAR=false,OCUP=false,VK="";
try{GAS=localStorage.getItem("surcos_gas")||""}catch(e){}
const clv=()=>RW+"|"+RP+"|"+FORZAR;
function guardarGas(){const v=$("#gas").value.trim();
 if(v&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){RES='<div class="err">El enlace debe empezar con https://script.google.com/ y terminar en /exec.</div>';return render()}
 GAS=v;try{localStorage.setItem("surcos_gas",v)}catch(e){}RES="";VK="";ESTADO={};cargarEstado();render()}
async function gas(o){if(!GAS)throw new Error("Falta el enlace del script de Google.");let r;
 try{r=await fetch(GAS,{method:"POST",body:JSON.stringify(Object.assign({clave:CLAVE},o))})}catch(e){throw new Error("No se pudo conectar con el script de Google. Revise el enlace y su internet.")}
 let d;try{d=await r.json()}catch(e){throw new Error("Respuesta no válida del script. Revise que esté implementado como aplicación web con acceso para “Cualquier persona”.")}
 if(!d.ok)throw new Error(d.error||"Error del script");return d}
async function cargarEstado(){if(!GAS)return;try{const d=await gas({accion:"estado"});ESTADO=d.log||{};if(TAB=="rec")render()}catch(e){}}
function resumen(d,acc){const o=d.omitidos||{},n=x=>esc(x==null?0:x),
 om=`${n(o.completaron)} ya completaron · ${n(o.yaEnviado)} ya recibieron este aviso · ${n(o.reciente)} recibieron otro correo hace menos de ${n(d.diasMin)} días · ${n(o.sinCorreo)} sin correo`;
 const tipo=d.tipo=="pendientes"?"solo pendientes":"aviso a todos",sim=d.simulado?'<p class="step"><b>Modo simulación activo en el script</b> (SIMULAR: true): no se envía ni se anota nada.</p>':"";
 if(acc=="vista")return `<div class="res">Se enviarían <b>${n(d.aEnviar)}</b> correos · Semana ${n(d.semana)} · ${tipo}.</div><p class="step">Se omiten: ${om}.</p>${sim}<p class="step">Cuota diaria restante de Gmail: ${n(d.cuota)}.</p>`;
 return `<div class="res">${d.simulado?"SIMULACIÓN · se habrían enviado":"Correos enviados"}: <b>${n(d.enviados)}</b> · Semana ${n(d.semana)} · ${tipo}.</div>${(d.fallidos||[]).length?`<div class="err">No se pudo enviar a: ${d.fallidos.map(esc).join(", ")}</div>`:""}${d.cuotaAgotada?'<div class="err">Se alcanzó la cuota diaria de Gmail. El resto quedó sin enviar; vuelva a intentarlo mañana (no se duplicarán los ya enviados).</div>':""}<p class="step">Se omitieron: ${om}.</p>${sim}`}
async function envio(acc){if(OCUP)return;
 if(acc=="enviar"){const m=ENV.filter(e=>e.codigo=="*"&&e.semana==RW&&e.canal=="correo").pop();if(!confirm((m?"⚠️ "+m.quien+" ya envió los correos de la Semana "+RW+" ("+hora(m.creado)+"). ¿Enviarlos de nuevo?":"¿Enviar ahora los correos de la Semana "+RW+"?")+" Esta acción no se puede deshacer."))return}
 OCUP=true;RES='<p class="step">Procesando…</p>';render();
 try{const d=await gas({accion:acc,semana:RW,soloPendientes:RP,forzar:FORZAR});RES=resumen(d,acc);VK=acc=="vista"&&d.aEnviar>0?clv():"";if(acc=="enviar"){VK="";if(d.enviados>0&&!d.simulado){try{await rpc("registrar_envio",{p_clave:CLAVE,p_codigos:["*"],p_semana:RW,p_canal:"correo"});await cargarEnvios()}catch(x){}}await cargarEstado()}}
 catch(e){RES=`<div class="err">${esc(e.message)}</div>`;VK=""}
 OCUP=false;render()}
/* ---------- control de envíos compartido ---------- */
let ENV=[];
async function cargarEnvios(){try{ENV=await rpc("listar_envios",{p_clave:CLAVE})||[]}catch(e){ENV=[]}}
const envi=(c,s,k)=>ENV.filter(e=>e.codigo==c&&e.semana==s&&e.canal==k).pop();
const hora=d=>new Date(d).toLocaleString("es-EC",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const ckp=(c,s)=>{const e=envi(c,s,"whatsapp");return e?{h:`<span class="pill">✓ ${esc(e.quien)} · ${hora(e.creado)}</span>`}:"–"};
function wa(c){const p=envi(c,RW,"whatsapp");if(p&&!confirm("Este WhatsApp ya lo envió "+p.quien+" ("+hora(p.creado)+"). ¿Enviarlo de nuevo?"))return false;rpc("registrar_envio",{p_clave:CLAVE,p_codigos:[c],p_semana:RW,p_canal:"whatsapp"}).then(cargarEnvios).then(render);return true}

function login(m){nav.innerHTML="";app.innerHTML=`<div class="card"><h2>Ingreso</h2><p class="step">Escriba la clave que le entregó la investigadora.</p><input id="k" type="password" placeholder="Clave"> <button id="bk" onclick="entrar()">Entrar</button>${m?`<div class="err">${esc(m)}</div>`:""}</div>`;$("#k").addEventListener("keydown",e=>{if(e.key=="Enter")entrar()})}
async function entrar(){CLAVE=$("#k").value;const b=$("#bk");b.disabled=true;b.textContent="Verificando…";await cargar()}
async function cargar(){try{const d=await rpc("colab_participantes",{p_clave:CLAVE});F=d.filas||[];GEN=d.generado;await semanas();await cargarEnvios();render()}catch(e){login(e.message)}}
const TABS=[["inicio","🏠 Resumen"],["fam","👥 Familias"],["rec","🔔 Recordatorios"]];
function go(t){TAB=t;render();window.scrollTo(0,0);if(t=="rec")cargarEstado()}
function render(){nav.innerHTML=`<div class="tabs">${TABS.map(t=>`<button class="${TAB==t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}<button class="s" style="margin-left:auto" onclick="cargar()">↻ Actualizar</button><button class="s" onclick="CLAVE='';F=[];login()">Cerrar sesión</button></div>`;
 app.innerHTML=({inicio:vInicio,fam:vFam,rec:vRec})[TAB]()+`<p class="step">Datos actualizados: ${GEN?new Date(GEN).toLocaleString("es-EC"):"–"}</p>`}
function vInicio(){const n=F.length,c=a=>F.filter(a).length,pct=x=>n?Math.round(x*100/n):0,h=hoy();
 const et=[["Registro",n],["Evaluación inicial",c(f=>f.pre)],["Hábitos S1",c(f=>hab(f,1))],["Hábitos S2",c(f=>hab(f,2))],["Hábitos S3",c(f=>hab(f,3))],["Evaluación final",c(f=>f.post)],["Encuesta",c(f=>f.sat)]];
 const est=s=>h<s.fecha_apertura?{h:'<span class="pill n">Próxima</span>'}:h>s.fecha_cierre?{h:'<span class="pill">Cerrada</span>'}:{h:'<span class="pill w">Abierta ahora</span>'};
 return `<div class="card"><h2>Avance de la campaña</h2><p class="step">Porcentaje sobre el total de registrados.</p>${et.map(x=>`<div class="bar"><span>${x[0]}</span><div class="trk"><i style="width:${pct(x[1])}%"></i></div><b>${x[1]} (${pct(x[1])}%)</b></div>`).join("")}</div>
 <div class="card"><h2>Calendario</h2>${T(["Semana","Tema","Abre","Cierra","Estado"],SEM.map(s=>[s.numero,s.titulo,s.fecha_apertura,s.fecha_cierre,est(s)]),"No se pudieron cargar las semanas.")}</div>`}
function vFam(){const m=(f,s)=>{const p=prog(f,s);return[p.l,p.r,hab(f,s)].filter(Boolean).length+"/3"};
 return `<div class="card"><h2>Familias (${F.length})</h2><p class="step">Cada semana muestra cuántas de 3 cosas hizo: lección, reto y hábitos.</p>${T(["Código","Nombre","Registro","Inicial","S1","S2","S3","Final","Encuesta"],F.map(f=>[f.codigo,dash(f.nombre),fecha(f.registrado),f.pre?"✓":"–",m(f,1),m(f,2),m(f,3),f.post?"✓":"–",f.sat?"✓":"–"]))}</div>`}
function vRec(){const n=RW,L=L2(),ok=VK&&VK==clv(),m=ENV.filter(e=>e.codigo=="*"&&e.semana==n&&e.canal=="correo").pop();
 return `<div class="card"><h2>Recordatorios semanales</h2><p class="step">Cada aviso queda marcado ✓ con quién lo envió, y el panel pregunta antes de repetirlo.</p>
 <label>Semana: <select onchange="RW=+this.value;VK='';RES='';render()">${[1,2,3].map(i=>`<option value="${i}" ${i==n?"selected":""}>Semana ${i}</option>`).join("")}</select></label>
 <label style="margin-left:14px"><input type="checkbox" ${RP?"checked":""} onchange="RP=this.checked;VK='';RES='';render()"> Solo pendientes</label></div>
 <div class="card"><h2>📧 Correo</h2>${m?`<div class="res">✓ ${esc(m.quien)} ya envió los correos de la Semana ${n} (${hora(m.creado)}).</div>`:""}
 ${GAS?`<button ${OCUP?"disabled":""} onclick="envio('vista')">1. Ver a quiénes se enviaría</button>${ok?`<button ${OCUP?"disabled":""} onclick="envio('enviar')">2. Confirmar y enviar</button>`:""}`:'<p class="step">Pegue abajo el enlace del script de Google para activar el envío por correo.</p>'}
 <div>${RES}</div><details ${GAS?"":"open"}><summary style="cursor:pointer;font-size:13px;color:var(--g)">Enlace del script de Google</summary><input id="gas" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(GAS)}" style="width:100%;max-width:560px"><br><button class="s" onclick="guardarGas()">Guardar enlace</button></details></div>
 <div class="card"><h2>💬 WhatsApp y lista de familias</h2><p class="step"><b>Mensaje:</b> ${esc(texto(n,null))}</p>
 <button class="s" onclick="navigator.clipboard.writeText(L2().map(f=>f.correo).filter(Boolean).join(', ')).then(()=>this.nextElementSibling.textContent='Copiado ✓')">Copiar correos (${L.filter(f=>f.correo).length})</button><span class="ok"></span>
 <p class="step">Si envía correos a mano, péguelos en el campo <b>CCO</b> (copia oculta).</p>
 ${T(["Código","Nombre","Estado","Correo","WhatsApp","Enviado"],L.map(f=>[f.codigo,dash(f.nombre),{h:pend(f,n)?'<span class="pill w">Pendiente</span>':'<span class="pill">Completó ✓</span>'},dash(f.correo),{h:tel(f.whatsapp)?`<a href="https://wa.me/${tel(f.whatsapp)}?text=${encodeURIComponent(texto(n,f))}" onclick="return wa('${f.codigo}')" target="_blank" rel="noopener">Enviar WhatsApp</a>`:"–"},ckp(f.codigo,n)]),"Nadie pendiente en esta semana.")}</div>`}
login();
</script></body></html>
