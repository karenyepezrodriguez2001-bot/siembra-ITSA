<script>
const URL="https://vokpjjidytayjrzjespr.supabase.co",KEY="sb_publishable_q6YCquh7-JYBEUrl1UCQfA_NDJ5ROGS";
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s),app=$("#app"),nav=$("#nav");
async function rpc(fn,a){let r;try{r=await fetch(`${URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify(a)})}catch(e){throw new Error("Sin conexión")}
 const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){d=t}if(!r.ok)throw new Error((d&&d.message)||"Error");return d}

 const tipo=d.tipo=="pendientes"?"solo pendientes":"aviso a todos",sim=d.simulado?'<p class="step"><b>Modo simulación activo en el script</b> (SIMULAR: true): no se envía ni se anota nada.</p>':"";

 if(SUB=="pre"||SUB=="post"){const k=SUB,lab=k=="pre"?"Evaluación inicial":"Evaluación final",ps=F.map(f=>sc(f[k])).filter(x=>x!=null),
  rows=L.map(f=>{const r=f[k],p=sc(r);return[f.codigo].concat(Array.isArray(r)?r:Array(10).fill("–"),[dash(p),dash(nv(p))])});
  b=`<h3>${lab}</h3>${b0}<p class="step">Letra elegida en cada pregunta. Puntaje y nivel (Bajo 0–4, Medio 5–7, Alto 8–10).</p>${T(H.concat(["Puntaje","Nivel"]),rows.concat(ps.length?[AV(["Promedio ("+ps.length+")"].concat(Array(10).fill(""),[avg(ps),""]))]:[]),"Ninguna familia coincide con la búsqueda.")}`}
 else{const rows=L.map(f=>{const a=sc(f.pre),p=sc(f.post);return[f.codigo,dash(a),dash(p),a!=null&&p!=null?(p-a>0?"+":"")+(p-a):"–"]}),
  par=F.filter(f=>f.pre&&f.post),dif=par.map(f=>sc(f.post)-sc(f.pre));
  b=`<h3>Comparación inicial y final</h3>${b0}${T(["Código","Inicial","Final","Cambio"],rows.concat([AV(["Promedio",avg(F.map(f=>sc(f.pre))),avg(F.map(f=>sc(f.post))),dif.length?(avg(dif)>0?"+":"")+avg(dif):"–"])]),"Ninguna familia coincide con la búsqueda.")}<p class="step">El cambio promedio se calcula solo con quienes hicieron las dos evaluaciones (${par.length}).</p>`}
 return `<div class="card"><h2>Conocimientos</h2><p class="step">Vista de solo lectura.</p>${sub([["pre","Evaluación inicial"],["post","Evaluación final"],["comp","Comparación"]])}${b}</div>`}

/* ---------- HÁBITOS (solo lectura) ---------- */
function vHab(){const L=flt(),N=["Agua","Lonchera","Juego","Pantallas"],g=(f,s)=>{const v=hab(f,s);return Array.isArray(v)?v:["–","–","–","–"]};let b="";
 if(SUB=="all")b=`<h3>Las 3 semanas juntas</h3>${buscador()}${T(["Código"].concat([1,2,3].flatMap(s=>N.map(x=>"S"+s+" "+x))),L.map(f=>[f.codigo].concat(g(f,1),g(f,2),g(f,3))),"Ninguna familia coincide con la búsqueda.")}`;
 else{const s=+SUB||1,env=F.filter(f=>hab(f,s));
  b=`<h3>Semana ${s}</h3>${buscador()}<p class="step">Días (de 0 a 7) en que se cumplió cada hábito. Enviaron: ${env.length} de ${F.length}.</p>${T(["Código"].concat(N),L.map(f=>[f.codigo].concat(g(f,s))).concat(env.length?[AV(["Promedio"].concat(N.map((_,i)=>avg(env.map(f=>g(f,s)[i])))))]:[]),"Ninguna familia coincide con la búsqueda.")}`}
 return `<div class="card"><h2>Hábitos semanales</h2><p class="step">Vista de solo lectura.</p>${sub([["1","Semana 1"],["2","Semana 2"],["3","Semana 3"],["all","Las 3 semanas"]])}${b}</div>`}

/* ---------- SATISFACCIÓN (solo lectura) ---------- */
function vSat(){const L=flt(),con=F.filter(f=>Array.isArray(f.sat));
 return `<div class="card"><h2>Encuesta de satisfacción</h2><p class="step">Vista de solo lectura. Valoraciones de 1 a 5. Respondieron ${con.length} de ${F.length}.</p>${buscador()}
 ${T(["Código","Utilidad","Claridad","Recomendaría","Comentario"],L.map(f=>{const x=Array.isArray(f.sat)?f.sat:[];return[f.codigo,dash(x[0]),dash(x[1]),dash(x[2]),{h:x[3]?`<span style="white-space:normal;display:inline-block;min-width:220px;text-align:left">${esc(x[3])}</span>`:"–"}]}).concat(con.length?[AV(["Promedio",avg(con.map(f=>f.sat[0])),avg(con.map(f=>f.sat[1])),avg(con.map(f=>f.sat[2])),""])]:[]),"Ninguna familia coincide con la búsqueda.")}</div>`}

/* ---------- ENVÍOS (solo lectura) ---------- */
function vEnv(){const W=ENV.filter(e=>e.canal=="whatsapp"),C=ENV.filter(e=>e.codigo=="*");
 const rows=[1,2,3].map(s=>{const c=C.filter(e=>e.semana==s).pop(),w=W.filter(e=>e.semana==s),u=new Set(w.map(e=>e.codigo)).size,lw=w.pop();return[s,c?c.quien+" · "+hora(c.creado):"Sin enviar",u+" de "+F.length,lw?lw.quien+" · "+hora(lw.creado):"–"]});
 return `<div class="card"><h2>Control de envíos</h2><p class="step">Quién envió cada recordatorio, desde este panel o desde el principal.</p>${T(["Semana","Correos (último envío)","WhatsApp enviados","Último WhatsApp"],rows)}<h3>Últimos movimientos</h3>${T(["Fecha","Quién","Semana","Canal","Familia"],ENV.slice(-40).reverse().map(e=>[hora(e.creado),e.quien,e.semana,e.canal,e.codigo=="*"?"Todas (correo)":e.codigo]),"Aún no hay envíos registrados.")}</div>`}

login();
